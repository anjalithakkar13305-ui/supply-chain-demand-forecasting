version: "3.9"

services:

  # ── FastAPI forecast service ───────────────────────────────────────────────
  api:
    build: .
    container_name: sc_forecast_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit dashboard ────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: sc_forecast_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./dashboard:/app/dashboard
    environment:
      - PYTHONPATH=/app
      - API_BASE=http://api:8000
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: sc_forecast_network
